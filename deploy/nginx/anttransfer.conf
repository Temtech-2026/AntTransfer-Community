# =====================================================================
# AntTransfer CE — Nginx 站点配置模板（同机反向代理）
#
# 适用形态（与根 docker-compose.yml 配套）：
#   · 前端静态产物 web/dist 由本 Nginx 托管；
#   · 后端由 docker compose 起在本机 127.0.0.1:8080；
#   · 前后端同源：前端构建时 baseURL 留空（见 web/src/app.tsx），一律请求 /api/**。
#
# ⚠️ 前置约束（任一不满足，整条链路不通）：
#   1. 同机部署。docker-compose.yml 把 server 端口显式绑定为 127.0.0.1:8080，
#      公网与内网其它机器都连不上。因此本 Nginx 必须与 compose 跑在同一台主机；
#      若要拆到另一台机器，须先改 compose 的端口绑定并同步处理数据库暴露面。
#   2. /api 前缀必须原样透传。后端 context-path=/api（application.yml），
#      故 proxy_pass 结尾**不得带 URI**：
#        ✅ proxy_pass http://127.0.0.1:8080;     → 后端收到 /api/v1/...
#        ❌ proxy_pass http://127.0.0.1:8080/;    → 前缀被剥成 /v1/...，全量 404
#
# 用法：
#   1. 按需替换下方 `server_name`、`root`、证书路径三处；
#   2. 把本文件 include 进现有 nginx 配置，或复制进 sites-enabled/ 后软链；
#   3. nginx -t && nginx -s reload。
#
# 若服务器上已有 Nginx 站点：不要整份照搬 server 块导致端口冲突，
# 只需把下面「三个 location」+ 两条 client_max_body_size 合并进现有 server 块。
# =====================================================================

upstream anttransfer_backend {
    server 127.0.0.1:8080;

    # 与后端保持长连接，降低高频分片上传时的握手开销
    keepalive 32;
}

# HTTP：如需强制跳转 HTTPS，取消下面注释（并保留 443 的 server 块）
# server {
#     listen 80;
#     server_name your-domain.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # ↓↓↓ 替换为真实域名或公网 IP ↓↓↓
    server_name your-domain.example.com;

    # ↓↓↓ 替换为前端产物实际落盘目录（web/dist 的内容放这里） ↓↓↓
    root /var/www/anttransfer;
    index index.html;

    # -----------------------------------------------------------------
    # 上传体积：后端 spring.servlet.multipart.max-request-size=80MB、
    # 单分片上限 64MiB（application.yml）。此处必须 ≥ 后端上限，并留出
    # multipart 边界与头部开销，否则合法分片会在 Nginx 层被 413 拦掉——
    # 后端连一行日志都不会有，排查成本极高（上线清单第 6 条要求 ≥ 80MB）。
    # -----------------------------------------------------------------
    client_max_body_size 100m;
    client_body_timeout 300s;

    # 访问日志（按需调整路径）
    access_log /var/log/nginx/anttransfer.access.log;
    error_log  /var/log/nginx/anttransfer.error.log warn;

    # -----------------------------------------------------------------
    # ① WebSocket：实时通知 /api/ws/notify
    #    · 浏览器 WebSocket 构造器不能设置自定义头，令牌走查询串
    #      （?token=...），握手在 Security 白名单内放行；
    #    · 普通 location 不转发 Upgrade/Connection 头，会导致握手恒 400，
    #      前端永久停在「正在建立实时连接」，故必须单独配置；
    #    · 前缀 /api/ws/ 比 /api/ 更长，Nginx 前缀匹配取最长者，优先级自然更高。
    # -----------------------------------------------------------------
    location /api/ws/ {
        proxy_pass http://anttransfer_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接超时：后端心跳 30s 探测 / 90s 判定掉线
        # （application.yml collaboration.ws）。Nginx 读超时必须远大于
        # 心跳间隔，否则会在客户端之前把连接掐断、前端表现为反复重连。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 长连接禁用缓冲，保证帧即时下发
        proxy_buffering off;
    }

    # -----------------------------------------------------------------
    # ② 后端 API：全部 /api/** 原样透传到 8080
    # -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://anttransfer_backend;
        proxy_http_version 1.1;

        # 复用 upstream keepalive 连接池须清空 Connection
        proxy_set_header Connection "";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 分片上传 / 合片 / 大文件下载：链路慢时需要更长的读写窗口
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;

        # 大分片不落 Nginx 临时盘，直接流式转发给后端
        proxy_request_buffering off;
        # 大文件下载流式透传，避免 Nginx 缓冲整份文件
        proxy_buffering off;
    }

    # -----------------------------------------------------------------
    # ③ 前端静态资源
    #    umi 构建开启了 hash 后缀（web/config/config.ts 的 hash: true），
    #    文件名随内容变化，可安全长期强缓存。
    # -----------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        # 静态资源不存在就是真的不存在，不要回退到 index.html
        try_files $uri =404;
    }

    # index.html 绝不缓存：否则发版后浏览器仍加载旧 index，
    # 其中引用的 hash 资源已被新版本删除 → 直接白屏。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # 版本描述文件（web/scripts/gen-version.mjs 的产物，随 dist 一起发布）：
    # 它本身就是「现网跑的是哪个提交」的查询入口，被缓存就失去意义，故同样不缓存。
    # 显式 =404：文件缺失时不要回退到 index.html——否则 curl 会拿到一坨 HTML，
    # 还要靠肉眼分辨「这是版本文件还是 SPA 回退」。
    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------
    # ④ SPA 前端路由回退
    #    前端为 history 路由，深链接（如 /file、/share/xxx）刷新时
    #    磁盘上并无对应文件，需回退到 index.html 交给前端路由处理。
    # -----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =====================================================================
# HTTPS 参考（按需启用；证书可用 certbot 申请）
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name your-domain.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#
#     root /var/www/anttransfer;
#     index index.html;
#
#     client_max_body_size 100m;
#
#     # 三个 location 与上方 HTTP 站点完全一致，建议抽成 include 文件复用，
#     # 避免两处配置漂移。
# }
# =====================================================================
