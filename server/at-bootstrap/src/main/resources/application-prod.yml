# =====================================================================
# AntTransfer CE — prod（生产环境）
#
# 生产部署清单（务必通过环境变量注入，禁止修改本文件硬编码）：
#   SPRING_PROFILES_ACTIVE=prod
#   SERVER_PORT
#   DB_URL / DB_USERNAME / DB_PASSWORD
#   FLYWAY_ENABLED=true（迁移脚本由构建期从根 sql/ 自动打包进 classpath:db/migration，见 at-bootstrap/pom.xml）
#   REDIS_HOST / REDIS_PORT / REDIS_DATABASE / REDIS_PASSWORD
# =====================================================================

# Flyway 无需在 prod 重复配置：迁移默认开启 + baseline-on-migrate 已落在主配置
# application.yml（FLYWAY_ENABLED=true）。如需临时关闭部署时置 FLYWAY_ENABLED=false。

# 生产环境关闭接口文档暴露
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# CORS 严格模式（红队 [D-01]）：fail-closed。
# 生产若未显式设置 ANTTRANSFER_CORS_ALLOWED_ORIGINS，白名单仍是 *，
# 启动期即抛 IllegalStateException 拒绝启动——这是刻意的：
# 配错的 CORS 属「静默开放」型缺陷，请求照常返回 200，只有浏览器侧跨域读取被授权，
# 运行时日志看不出任何异常，启动失败是唯一能让它被发现的时机。
# 该键被 at-gateway / at-auth / at-collaboration(WebSocket) 三处同源消费，改此一处即全生效。
anttransfer:
  cors:
    strict: true

mybatis-plus:
  configuration:
    # 生产关闭 SQL 控制台输出
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: warn
    com.anttransfer: info
