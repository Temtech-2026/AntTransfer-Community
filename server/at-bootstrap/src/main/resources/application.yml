# =====================================================================
# AntTransfer CE — 主配置（公共配置，profile 差异化见 application-dev/prod.yml）
#
# 敏感连接一律使用“环境变量占位”写法：${ENV_NAME:默认值}
#   · 默认值保证本地零配置即可启动（dev）
#   · 部署时通过环境变量注入，密码等敏感信息不落盘
#   · 可用环境变量一览：
#     SERVER_PORT / SPRING_PROFILES_ACTIVE
#     DB_URL / DB_USERNAME / DB_PASSWORD / FLYWAY_ENABLED
#     REDIS_HOST / REDIS_PORT / REDIS_DATABASE / REDIS_PASSWORD
# =====================================================================
server:
  # 服务端口
  port: ${SERVER_PORT:8080}
  servlet:
    # 全局 API 前缀（所有接口 / 文档路径均在其下）
    context-path: /api

spring:
  application:
    name: anttransfer-ce

  # 默认激活 dev；生产部署设置环境变量 SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---------------- MySQL（数据源，连接信息环境变量化） ----------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认连接「本地 dev 容器库」：端口刻意用 3307（= docker-compose.dev.yml 的宿主机映射），
    # 与开发者本机自装的 MySQL（3306）错开——容器没起来时这里直接连接失败，
    # 而不会静默连上本机 3306 的库、把本机库误当成容器库。
    # 生产务必通过 DB_URL 覆盖；改用本机自装 MySQL 时也请显式指定 DB_URL。
    url: '${DB_URL:jdbc:mysql://localhost:3307/anttransfer?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}'
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      # 连接池最小空闲连接数
      minimum-idle: 5
      # 连接池最大连接数
      maximum-pool-size: 20
      # 获取连接超时（毫秒）
      connection-timeout: 30000

  # ---------------- Redis（连接信息环境变量化） ----------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 默认 0 号库；Redis 未开启 requirepass 时无需配置密码
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 5s

  # ---------------- Flyway 数据库版本化迁移 ----------------
  flyway:
    # 应用启动即自动迁移（默认开启，部署时可 FLYWAY_ENABLED=false 临时关闭）。
    # 迁移脚本由 Flyway 依据 flyway_schema_history 自动增量执行，脚本只增不改为铁律。
    enabled: ${FLYWAY_ENABLED:true}
    # 迁移脚本目录固定为 classpath:db/migration。脚本唯一事实源在仓库根 sql/，
    # 构建期由 at-bootstrap 自动打包至此（见 at-bootstrap/pom.xml 的 copy-flyway-migrations），
    # 请勿改为 filesystem 相对路径，也不要手工复制脚本到本模块资源目录。
    locations: classpath:db/migration
    # baseline 设定：目标库若已存在业务表但无 flyway_schema_history（存量库/手工建库），
    # baseline-on-migrate 自动按 baseline-version=0 打基线后从 V1 顺序执行；
    # 空库不受影响（直接建历史表并执行全部版本）。
    # 注意：曾按“旧 V1~V3”执行过的库哈希不一致，需 flyway clean / DROP 重建（见 sql/README）。
    baseline-on-migrate: true
    baseline-version: 0

  # ---------------- Jackson 序列化 ----------------
  # 时间契约（docs/api/README.md §4）：统一 ISO-8601 字符串。
  # 刻意不配置 date-format / time-zone：
  #   · date-format 只作用于 java.util.Date/Calendar，会把 Date 输出成 "yyyy-MM-dd HH:mm:ss"
  #     这种空格分隔的非 ISO 形态，破坏契约；而 java.time.* 由 JavaTimeModule 处理，
  #     本就输出 ISO-8601（如 2026-09-06T14:30:00），无需也无法靠 date-format 定制。
  #   · time-zone 是 Date 序列化时区，LocalDateTime 无时区概念不受影响；跨时区字段
  #     请显式使用 OffsetDateTime / Instant（自带偏移），不依赖全局时区。
  jackson:
    serialization:
      # 时间类型输出为字符串而非时间戳（JavaTimeModule 据此输出 ISO-8601）
      write-dates-as-timestamps: false

  # ---------------- 分片上传的 multipart 上限 ----------------
  # 分片经 multipart/form-data 提交，Servlet 容器会在进入 Controller 之前先按此上限拦截：
  #   · max-file-size 必须 ≥ anttransfer.transfer.max-chunk-size（64 MiB），否则合法分片被裸 400 拒绝，
  #     业务日志里连栈都没有，排查成本极高；
  #   · 上限刻意贴近「单分片大小」而非「单文件大小」——分片端点每次只应收到一个分片，
  #     放宽到 GB 级只会让超长请求先落盘、再被业务按 size 校验拒绝，白耗暂存盘与带宽；
  #   · file-size-threshold=0 表示一律落临时文件，不在内存里缓冲 64 MiB。
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 80MB
      file-size-threshold: 0

# ---------------- MyBatis-Plus ----------------
mybatis-plus:
  # 各 at-* 模块的 Mapper XML 统一放本模块资源 mapper/ 目录下（classpath* 支持跨模块）
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 下划线转驼峰（数据库列 transfer_size <-> 属性 transferredSize）
    map-underscore-to-camel-case: true
    # 关闭二级缓存，避免多模块缓存边界混乱
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      # 主键全局默认策略：雪花算法（与 at-common 的 BaseEntity 声明一致）
      id-type: assign_id
      # 逻辑删除公共字段配置（BaseEntity.deleted 映射列 deleted）：0-未删 1-已删
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------------- 认证与令牌（at-auth） ----------------
anttransfer:
  auth:
    # HS256 签名密钥（须 ≥ 32 字节）。生产必通过环境变量 AUTH_ACCESS_TOKEN_SECRET 注入强随机串，
    # 默认值仅供本地 dev 冒烟，禁止用于生产！
    access-token-secret: '${AUTH_ACCESS_TOKEN_SECRET:dev-only-secret-change-me-0123456789abcdef-0123456789}'
    # access token 有效期（PRD US-07 默认 30 分钟）
    access-token-ttl: 30m
    # refresh token 有效期 / Redis 白名单 TTL（PRD US-07 默认 7 天）
    refresh-token-ttl: 7d
    # 登录失败锁定：阈值 5 次 / 窗口 15 分钟（红队 [D-03]，Redis 计数）
    login-fail-threshold: 5
    login-lock-duration: 15m
    # 追加免登录白名单（PathPattern，不含 /api 前缀）。默认留空是刻意的。
    #
    # ⚠️ 本键只能放「环境相关」的路径（例如某个 profile 才存在的调试端点）。
    # 「产品固有」的匿名入口——登录 / 刷新、外发分享访客侧、文件取件、WebSocket 握手——
    # 一律写死在 SecurityConfig.BUILT_IN_PERMIT_ALL，不要挪到这里来：
    #   · profile 配置文档（application-dev.yml 等）优先级高于本文件；
    #   · 且 List 属性是「整体替换」而非逐项合并——任一 profile 写了一次本键，
    #     本文件里配置的内容就被整份丢弃。
    # 曾经 dev profile 为放行 Swagger 写了本键，导致 5 个产品固有匿名入口在 dev 下全部
    # 失效：WebSocket 握手 401(1001)，前端永远停在「正在建立实时连接」，文件取件与分享
    # 核销同样 401（而 prod 未写本键，反而正常）。
    #
    # 如需临时放行，取消下面注释即可——但请记住它同样会「替换」本文件已有配置，
    # 且永远删不掉代码里的内置项。
    # permit-all:
    #   - /v1/debug/**

  # ---------------- RBAC 权限（at-permission） ----------------
  permission:
    # 显式 Deny（Deny 优先）：角色 → 永远拒绝的权限点黑名单，即使已由其他角色授予。
    # 落地三权分立红线（system-design §3.2）：
    #   · AUDITOR：纵深防御禁止一切写类文件操作（其本身亦未授予这些权限点）；
    #   · 「日志清除」类高危操作：CE 从不签发权限点（见 sql/V2__init_data.sql），
    #     因此 SUPER_ADMIN 也永远无法通过形如 audit:log:clear 的 @RequiresPerm 校验。
    role-deny:
      AUDITOR:
        - 'file:upload'
        - 'file:edit'
        - 'file:share'
        - 'file:destroy'

  # ---------------- 文件与外发分享（at-file） ----------------
  # 映射 ShareProperties（@ConfigurationProperties("anttransfer.file.share")）。
  # 下列取值与代码默认值一致，显式列出便于运维查阅与按需覆盖（不改代码即可调策略）。
  file:
    # 上传扩展名白名单（红队 [R-02]，fail-closed）。校验口径是「扩展名白名单 + 魔数一致性」双查：
    # 只查扩展名挡不住改名换后缀；只查魔数挡不住「合法魔数 + 危险后缀」（如带 MZ 头的 a.exe）。
    # 危险扩展名（html / js / exe / sh / xml / svg / jar …）另有硬编码黑名单，先于本清单生效，写进来也不放行。
    # 与 FileProperties#allowedExtensions 的关系：代码默认值是空集（= 拒绝全部上传），
    # 故本清单是「上传可用」的必要条件；一旦被误删，表现为所有上传都失败而非什么都能传
    # （由 UploadWhitelistConfigTest 守卫，避免静默退化成放开）。
    allowed-extensions:
      - png
      - jpg
      - jpeg
      - gif
      - bmp
      - webp
      - pdf
      - txt
      - md
      - log
      - csv
      - json
      - yml
      - yaml
      - ini
      - conf
      - properties
      - sql
      - zip
      - 7z
      - rar
      - gz
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
      - wps
      - et
      - dps
      - vsd
      - vsdx
      - mp3
      - wav
      - ogg
      - mp4
      - mov
      - webm
      - mkv
    share:
      # 总开关：关闭后「创建 / 撤销 / 查询 / 访客换票」全部拒绝（熔断），
      # 但不影响已生成链接的「核销取件」（避免熔断时已外发的链接突然不可取）。
      enabled: true
      # 提取码长度：≥ 6 位字母数字（PRD US-03）；上限用于防超长输入拖垮 BCrypt
      extract-code-min-length: 6
      extract-code-max-length: 32
      # 下载次数：默认值与硬上限（显式指定超过上限以 2005 拒绝，杜绝「无限次」外发）
      default-download-limit: 10
      max-download-limit: 1000
      # 有效期：默认 7 天，最长 30 天（超限以 2005 拒绝）
      default-expire: 7d
      max-expire: 30d
      # 提取码连错 5 次锁 30 分钟（D-8 裁定口径；注意不是 15min——那是登录失败锁，勿串抄）
      max-code-errors: 5
      code-lock-duration: 30m
      # 一次性票据 TTL：仅需覆盖「校验 → 取件」间隔，越短越安全（Redis GETDEL，不落库）
      ticket-ttl: 5m
      # 内容扫描总开关：false 时后缀黑名单 / 敏感词 / EE 扫描器全部不生效（应急放行，默认 true）
      content-scan-enabled: true
      # 外发后缀黑名单（不区分大小写）：默认阻断可执行 / 安装类格式。
      # 局限见红队 [V-04]：改名可绕过，EE 应改为「白名单 + 内容嗅探」。
      blocked-extensions:
        - exe
        - sh
        - bat
        - msi
        - com
        - scr
      # 文件名敏感词（不区分大小写，命中即 4007 拦截并写 SHARE_BLOCKED 审计）；
      # 置为 [] 即关闭该规则（例如内网频繁误伤正常文件名时），不影响后缀黑名单。
      sensitive-words:
        - 机密
        - 绝密
        - 身份证
        - 薪酬

  # ---------------- 分片上传（at-transfer） ----------------
  # 映射 TransferProperties（anttransfer.transfer.*）。
  # 下列取值与代码默认值一致，显式列出便于运维查阅与按需覆盖（不改代码即可调策略）。
  transfer:
    # ⚠ 本块绑定到 TransferProperties 的 long 字段，**必须写字节数**，不能写 8MB / 64MB。
    #   Spring 只对 DataSize / Duration 类型做单位解析；写成 8MB 会在启动绑定阶段抛
    #   NumberFormatException（Failed to bind properties under 'anttransfer.transfer.chunk-size'），
    #   整个应用起不来。Duration 类配置（如 auth.access-token-ttl: 30m）才可以用单位后缀。
    # 默认单分片 8 MiB = 8 × 1024 × 1024：前端按预检返回的 chunkSize 切片，改这里即改前端切片粒度
    chunk-size: 8388608
    # 单分片上限 64 MiB = 64 × 1024 × 1024，须与 spring.servlet.multipart.max-file-size（64MB）对齐
    max-chunk-size: 67108864
    # 单任务分片数上限（受 uploaded_indexes varchar(8192) 约束）；超限自动放大分片而非拒绝
    max-chunk-count: 1024
    # 分片暂存根目录（合片前的 *.part 与 merged.bin）：须落在持久卷上，容器内请指到挂载点
    staging-root: ${TRANSFER_STAGING_ROOT:./data/transfer-staging}
    # 单用户同时进行中的任务数上限，超出以 4103 拒绝，防止暂存盘被刷爆
    max-active-tasks: 3
    # 进行中任务的保留时长（小时）：超时任务在后续预检时顺带标记失败并清理暂存
    task-ttl-hours: 24

  # ---------------- 通知与 IM（at-collaboration） ----------------
  # 映射 NotifyProperties（anttransfer.collaboration.notify.*）与 WsProperties（anttransfer.collaboration.ws.*）。
  # 下列取值与代码默认值一致，显式列出便于运维查阅与按需覆盖（不改代码即可调策略）。
  collaboration:
    notify:
      # 邮件渠道（P1 附加通道）总开关：默认关闭——CE 默认无 SMTP 依赖可用；
      # 打开时须同时配置 spring.mail.*，否则该渠道仅降级记录日志，不影响站内信。
      email-enabled: false
      # 邮件发件人（仅邮件渠道启用时生效）
      from: ${NOTIFY_MAIL_FROM:no-reply@anttransfer.local}
      # 离线补拉单次返回条数上限（防重连时一次性拉爆内存 / 响应体）
      offline-pull-limit: 50
      # 会话历史单次返回条数上限（聊天记录向上翻页的硬上限）
      chat-history-limit: 50
      # 会话列表单次返回条数上限（聊天页左侧栏；与历史条数分开，避免调大总览顺带放大翻页响应体）
      chat-conversation-limit: 50
      # 会话消息保留期（天）：PRD §4 P1 承诺「消息持久化 ≥ 30 天」，故 30 是**不可下探的下限**——
      # 配小于 30 时清理任务按 30 执行（钳制点在 ChatRetentionScheduler）。钳制刻意不写回本配置，
      # 便于排查时区分「配置写了什么」与「实际按什么执行」。调大只多花存储，永远安全。
      message-retention-days: 30
      # 保留期清理单批删除行数：单批过大 = 长事务 + 长时间行锁，过小则批次变多、任务拖长。
      # 单次触发的删除上界 = 本值 × 100（MAX_ROUNDS），默认 10 万行/天，足够追上日常增量。
      message-cleanup-batch-size: 1000
      # 保留期清理触发时间（默认每日 04:20）：与文件域清理（每日 03:30）错峰，
      # 两者都要写库/写盘，同刻执行会让抖动叠加。错开整点以避开 NTP 校时造成的任务聚集。
      message-cleanup-cron: '0 20 4 * * ?'
    ws:
      # 心跳探测间隔（秒）：服务端定期向本机全部连接发 PING。
      # 须远小于常见 NAT / 负载均衡的空闲回收时间（通常 60~300s），否则连接会被中间设备静默掐断。
      heartbeat-interval-seconds: 30
      # 心跳超时（秒）：超过该时长未收到任何上行帧即判定掉线并清理（须 > 探测间隔，默认 3 倍容错）。
      # 宁可晚 60s 清理僵尸连接，也不要频繁误踢真实用户。
      heartbeat-timeout-seconds: 90
      # 单条发送超时（毫秒）与单连接发送缓冲上限（字节，默认 512KB）：
      # 客户端「只收不消费」时待发队列会无限堆积直至 OOM，写不出去即判定连接已死并踢除。
      send-time-limit-millis: 5000
      buffer-size-limit-bytes: 524288
      # 单帧文本上限（字节，默认 64KB）：容器级生效（ServletServerContainerFactoryBean），防超大帧打爆内存
      text-message-size-limit-bytes: 65536

  # ---------------- CORS 白名单（at-gateway / at-auth 同键消费） ----------------
  cors:
    # dev 默认放开；生产须用环境变量 ANTTRANSFER_CORS_ALLOWED_ORIGINS 收紧为显式来源白名单
    #（如 http://your.domain 或 https://*.company.com），携带凭证场景禁止使用 *
    allowed-origin-patterns: '${ANTTRANSFER_CORS_ALLOWED_ORIGINS:*}'
    # 严格模式（红队 [D-01]）：true 时启动期校验白名单，携带凭证 + 通配来源直接拒绝启动。
    # 默认 false 仅为兼容 dev 前端直连；生产 profile 已置 true（见 application-prod.yml）。
    # 开关只影响「是否在启动期校验」，不放宽任何实际放行范围。
    strict: '${ANTTRANSFER_CORS_STRICT:false}'

# ---------------- 版本与运维探针（actuator） ----------------
# 目的：让「线上跑的是哪个提交」成为一条命令可查的事实，而不是靠时间戳间接推断。
# 暴露面刻意收窄：只开 health（仅 status，不含组件明细）与 info（只含构建元数据）。
# 两者免登录（见 at-auth SecurityConfig.BUILT_IN_PERMIT_ALL）：健康探针常被负载均衡 /
# 容器编排在无凭证上下文调用；info 只回版本号、提交号与构建时间，不含任何配置值、
# 环境变量或连接串。实际路径带上下文前缀：GET /api/actuator/info、GET /api/actuator/health
management:
  endpoints:
    web:
      exposure:
        # 白名单式暴露：Boot 默认只开 health，这里显式补 info；
        # 严禁改成 '*'——那会把 env / beans / heapdump / threaddump 等敏感端点一并放出去
        include: health,info
  endpoint:
    health:
      # 永不返回组件明细（数据源地址、磁盘路径、Redis 版本等），只回 UP/DOWN
      show-details: never
  info:
    build:
      # 读取 META-INF/build-info.properties（由 spring-boot-maven-plugin 的 build-info goal 生成）
      enabled: true

# ---------------- 日志（profile 内可再细化） ----------------
logging:
  level:
    root: info
    com.anttransfer: info
