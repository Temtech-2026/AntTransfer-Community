# =====================================================================
# AntTransfer CE — 主配置（公共配置，profile 差异化见 application-dev/prod.yml）
#
# 敏感连接一律使用“环境变量占位”写法：${ENV_NAME:默认值}
#   · 默认值保证本地零配置即可启动（dev）
#   · 部署时通过环境变量注入，密码等敏感信息不落盘
#   · 可用环境变量一览：
#     SERVER_PORT / SPRING_PROFILES_ACTIVE
#     DB_URL / DB_USERNAME / DB_PASSWORD / FLYWAY_ENABLED
#     REDIS_HOST / REDIS_PORT / REDIS_DATABASE / REDIS_PASSWORD
# =====================================================================
server:
  # 服务端口
  port: ${SERVER_PORT:8080}
  servlet:
    # 全局 API 前缀（所有接口 / 文档路径均在其下）
    context-path: /api

spring:
  application:
    name: anttransfer-ce

  # 默认激活 dev；生产部署设置环境变量 SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---------------- MySQL（数据源，连接信息环境变量化） ----------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认连接本地库 anttransfer；生产务必通过 DB_URL 覆盖
    url: '${DB_URL:jdbc:mysql://localhost:3306/anttransfer?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}'
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      # 连接池最小空闲连接数
      minimum-idle: 5
      # 连接池最大连接数
      maximum-pool-size: 20
      # 获取连接超时（毫秒）
      connection-timeout: 30000

  # ---------------- Redis（连接信息环境变量化） ----------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 默认 0 号库；Redis 未开启 requirepass 时无需配置密码
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 5s

  # ---------------- Flyway 数据库版本化迁移 ----------------
  flyway:
    # 应用启动即自动迁移（默认开启，部署时可 FLYWAY_ENABLED=false 临时关闭）。
    # 迁移脚本由 Flyway 依据 flyway_schema_history 自动增量执行，脚本只增不改为铁律。
    enabled: ${FLYWAY_ENABLED:true}
    # 迁移脚本目录固定为 classpath:db/migration。脚本唯一事实源在仓库根 sql/，
    # 构建期由 at-bootstrap 自动打包至此（见 at-bootstrap/pom.xml 的 copy-flyway-migrations），
    # 请勿改为 filesystem 相对路径，也不要手工复制脚本到本模块资源目录。
    locations: classpath:db/migration
    # baseline 设定：目标库若已存在业务表但无 flyway_schema_history（存量库/手工建库），
    # baseline-on-migrate 自动按 baseline-version=0 打基线后从 V1 顺序执行；
    # 空库不受影响（直接建历史表并执行全部版本）。
    # 注意：曾按“旧 V1~V3”执行过的库哈希不一致，需 flyway clean / DROP 重建（见 sql/README）。
    baseline-on-migrate: true
    baseline-version: 0

  # ---------------- Jackson 序列化 ----------------
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 时间类型输出为字符串而非时间戳
      write-dates-as-timestamps: false

# ---------------- MyBatis-Plus ----------------
mybatis-plus:
  # 各 at-* 模块的 Mapper XML 统一放本模块资源 mapper/ 目录下（classpath* 支持跨模块）
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 下划线转驼峰（数据库列 transfer_size <-> 属性 transferredSize）
    map-underscore-to-camel-case: true
    # 关闭二级缓存，避免多模块缓存边界混乱
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      # 主键全局默认策略：雪花算法（与 at-common 的 BaseEntity 声明一致）
      id-type: assign_id
      # 逻辑删除公共字段配置（BaseEntity.deleted 映射列 deleted）：0-未删 1-已删
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------------- 日志（profile 内可再细化） ----------------
logging:
  level:
    root: info
    com.anttransfer: info
