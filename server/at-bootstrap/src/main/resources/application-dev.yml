# =====================================================================
# AntTransfer CE — dev（开发环境，默认 profile）
#
# 说明：连接信息已在 application.yml 中以环境变量占位 + 本地默认值给出，
#       本文件仅做“调试体验”相关差异化配置（SQL 打印、接口文档、日志级别）。
# =====================================================================

# 接口文档：Swagger UI（Knife4j 风格可由 at-bootstrap 后续按需引入）
springdoc:
  swagger-ui:
    # 文档入口：http://localhost:8080/api/swagger-ui/index.html
    enabled: true

anttransfer:
  # 免登录白名单（dev 追加项）：只放行 Swagger / OpenAPI，便于自测
  # （prod 由 application-prod.yml 关闭文档端点，故不追加）。
  #
  # ⚠️ 本键会「整体替换」application.yml 里的同名配置，而非逐项追加——Spring Boot 的
  # profile 配置文档优先级更高，List 属性不做合并。因此这里只能写「环境相关」的路径。
  # 产品固有的匿名入口（登录 / 刷新、分享访客侧、文件取件、WebSocket 握手）已写死在
  # SecurityConfig.BUILT_IN_PERMIT_ALL，不受本键影响。
  # 历史事故：本键曾让那 5 个入口在 dev 下全部失效，表现为 WebSocket 一直连不上。
  auth:
    permit-all:
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /favicon.ico
  # RBAC 冒烟端点开关（仅 dev，生产勿开）
  smoke:
    enabled: true

mybatis-plus:
  configuration:
    # 开发期将 SQL 打印到控制台，便于排查；生产已在 prod profile 关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    # 开发期全量 DEBUG，含 SQL 参数日志
    com.anttransfer: debug
    org.springframework.web: info
