name: 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚「要解决什么问题」，而不仅是「要什么功能」。
  - type: textarea
    id: problem
    attributes:
      label: 背景 / 要解决的问题
      description: 你正在尝试做什么？现有方案卡在哪里？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 你理想中的交互或接口形态。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他考虑过的方案
      description: 可选。备选方案及取舍。
  - type: checkboxes
    id: scope
    attributes:
      label: 涉及模块
      options:
        - label: 后端 server
        - label: 前端 web
        - label: 数据库/脚本
        - label: 文档/部署
